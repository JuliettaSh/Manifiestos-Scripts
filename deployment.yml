apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp-deployment
  namespace: 0311at-web
spec:
  replicas: 1
  strategy:                
    type: Recreate  
  selector:
    matchLabels:
      app: webapp
  template:
    metadata:
      labels:
        app: webapp
    spec:
      initContainers:
      - name: copy-content
        image: busybox
        command: ['sh', '-c', 'echo "Verificando contenido..."; ls -la /mnt/website; mkdir -p /usr/share/nginx/html; if [ "$(ls -A /mnt/website)" ]; then cp -v /mnt/website/* /usr/share/nginx/html; echo "Copia completada"; else echo "ERROR: /mnt/website está vacío - creando placeholder"; echo "<h1>Sitio en construcción</h1>" > /usr/share/nginx/html/index.html; fi']
        volumeMounts:
        - name: html-volume
          mountPath: /usr/share/nginx/html
        - name: host-volume
          mountPath: /mnt/website
      containers:
      - name: nginx
        image: nginx:alpine
        ports:
        - containerPort: 80
        volumeMounts:
        - name: html-volume
          mountPath: /usr/share/nginx/html
      volumes:
      - name: html-volume
        emptyDir: {}
      - name: host-volume
        hostPath:
          path: /mnt/website
          type: DirectoryOrCreate  
